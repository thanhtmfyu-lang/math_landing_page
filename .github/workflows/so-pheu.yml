# Số phễu cho phòng marketing (HSA1, tài khoản ngoài, đăng ký theo mã ?nguon=). 21:00 giờ VN hằng ngày + chạy tay.
# Kho công khai: log KHÔNG in số. Kết quả mã hóa bằng khóa công khai .github/so-pheu/khoa-cong-khai.pem,
# tải lên artifact "so-pheu"; chỉ người giữ khóa riêng (thư mục nội bộ của công ty) mới mở được.
# Chỉ một truy vấn đọc số tổng, nhẹ, nên được chạy cả giờ có ca học.
name: Số phễu hằng ngày

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      tu:
        description: 'Từ ngày YYYY-MM-DD (để trống = 13 ngày trước ngày đến)'
        required: false
        default: ''
      den:
        description: 'Đến ngày YYYY-MM-DD (để trống = hôm nay giờ VN)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: so-pheu
  cancel-in-progress: false

jobs:
  lay-so:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: egljwujhgdapaxyrjskj
      TU: ${{ inputs.tu }}
      DEN: ${{ inputs.den }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/so-pheu
      - name: Lấy số và mã hóa
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "Chưa có secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          den=${DEN:-$(TZ=Asia/Ho_Chi_Minh date +%F)}
          [[ "$den" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && date -d "$den" >/dev/null 2>&1 || { echo "Ngày đến sai dạng"; exit 1; }
          tu=${TU:-$(date -d "$den -13 days" +%F)}
          [[ "$tu" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && date -d "$tu" >/dev/null 2>&1 || { echo "Ngày từ sai dạng"; exit 1; }
          [[ "$tu" < "$den" || "$tu" == "$den" ]] || { echo "Ngày từ sau ngày đến"; exit 1; }
          sed -e "s/__TU__/$tu/g" -e "s/__DEN__/$den/g" .github/so-pheu/so-pheu.sql | jq -Rs '{query: .}' > /tmp/than.json
          code=$(curl -sS -o /tmp/ket-qua.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @/tmp/than.json)
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "LỖI truy vấn (HTTP $code): $(jq -r '.message // empty' /tmp/ket-qua.json 2>/dev/null | head -n1 | sed -E 's/DETAIL.*//; s/[0-9]{3,}/***/g' | head -c 300)"; exit 1; fi
          mkdir -p ra; jq -c '.[0].so' /tmp/ket-qua.json > /tmp/so.json
          [ "$(jq -r 'type' /tmp/so.json)" = object ] || { echo "Kết quả không đúng dạng"; exit 1; }
          openssl rand -hex 32 > /tmp/k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/so.json -out ra/so.json.enc -pass file:/tmp/k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/so-pheu/khoa-cong-khai.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/k.txt -out ra/k.enc
          echo "$tu $den" > ra/khoang.txt
          shred -u /tmp/so.json /tmp/k.txt /tmp/ket-qua.json
          echo "ĐẠT  số phễu $tu → $den (đã mã hóa)"
      - uses: actions/upload-artifact@v4
        with:
          name: so-pheu
          path: ra/
          retention-days: 30
