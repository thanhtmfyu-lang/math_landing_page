# Lấy số phễu (hàm public.mtm_pt_so_pheu) mà không lộ số trên kho công khai: kết quả được MÃ HÓA bằng khóa công khai
# .github/so-pheu-pub.pem rồi đưa lên artifact giữ 1 ngày; log chỉ in ĐẠT/LỖI. Chỉ người giữ khóa riêng mới đọc được.
# Chạy tay: Actions > "Số phễu" > Run workflow (tu, den dạng YYYY-MM-DD).
name: Số phễu

on:
  workflow_dispatch:
    inputs:
      tu:
        description: 'Từ ngày YYYY-MM-DD'
        required: true
      den:
        description: 'Đến ngày YYYY-MM-DD'
        required: true

permissions:
  contents: read

jobs:
  lay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: egljwujhgdapaxyrjskj
      TU: ${{ inputs.tu }}
      DEN: ${{ inputs.den }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/so-pheu-pub.pem
          sparse-checkout-cone-mode: false
      - name: Lấy và mã hóa
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "Chưa có secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          [[ "$TU" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && "$DEN" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Ngày sai dạng"; exit 1; }
          umask 077; mkdir -p out
          body=$(jq -n --arg tu "$TU" --arg den "$DEN" '{query: "select public.mtm_pt_so_pheu(\u0027\($tu)\u0027::date,\u0027\($den)\u0027::date) d"}')
          code=$(curl -sS -o /tmp/kq.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data "$body")
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || { echo "LỖI HTTP $code"; exit 1; }
          openssl rand -out /tmp/k.bin 32
          openssl pkeyutl -encrypt -pubin -inkey .github/so-pheu-pub.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/k.bin -out out/khoa.enc
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:/tmp/k.bin -in /tmp/kq.json -out out/so-pheu.enc
          rm -f /tmp/k.bin /tmp/kq.json
          echo "ĐẠT (đã mã hóa)"
      - uses: actions/upload-artifact@v4
        with:
          name: so-pheu
          path: out/
          retention-days: 1
