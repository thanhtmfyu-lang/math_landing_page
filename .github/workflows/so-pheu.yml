# Số phễu cho phòng marketing (HSA1, tài khoản ngoài, đăng ký theo mã ?nguon=). 21:00 giờ VN hằng ngày + chạy tay.
# Lịch 21:00 VN (14:00 UTC); nếu lịch đứng, đổi tệp này trên main để GitHub đăng ký lại.
# Kho công khai: log KHÔNG in số. Kết quả mã hóa bằng khóa công khai .github/so-pheu/khoa-cong-khai.pem,
# ghi bản mã hóa (base64) vào thân issue nhãn "so-pheu" và artifact "so-pheu"; chỉ người giữ khóa riêng
# (thư mục nội bộ của công ty) mới mở được. Đọc bằng API GitHub: issue nhãn so-pheu, tách khối giữa hai dòng ---.
# Chỉ một truy vấn đọc số tổng, nhẹ, nên được chạy cả giờ có ca học.
name: Số phễu hằng ngày

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      tu:
        description: 'Từ ngày YYYY-MM-DD (để trống = 13 ngày trước ngày đến)'
        required: false
        default: ''
      den:
        description: 'Đến ngày YYYY-MM-DD (để trống = hôm nay giờ VN)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: so-pheu
  cancel-in-progress: false

jobs:
  lay-so:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: egljwujhgdapaxyrjskj
      TU: ${{ inputs.tu }}
      DEN: ${{ inputs.den }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/so-pheu
      - name: Lấy số và mã hóa
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "Chưa có secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          den=${DEN:-$(TZ=Asia/Ho_Chi_Minh date +%F)}
          [[ "$den" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && date -d "$den" >/dev/null 2>&1 || { echo "Ngày đến sai dạng"; exit 1; }
          tu=${TU:-$(date -d "$den -13 days" +%F)}
          [[ "$tu" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && date -d "$tu" >/dev/null 2>&1 || { echo "Ngày từ sai dạng"; exit 1; }
          [[ "$tu" < "$den" || "$tu" == "$den" ]] || { echo "Ngày từ sau ngày đến"; exit 1; }
          sed -e "s/__TU__/$tu/g" -e "s/__DEN__/$den/g" .github/so-pheu/so-pheu.sql | jq -Rs '{query: .}' > /tmp/than.json
          code=$(curl -sS -o /tmp/ket-qua.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @/tmp/than.json)
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "LỖI truy vấn (HTTP $code): $(jq -r '.message // empty' /tmp/ket-qua.json 2>/dev/null | head -n1 | sed -E 's/DETAIL.*//; s/[0-9]{3,}/***/g' | head -c 300)"; exit 1; fi
          # Phòng thi có ghi CSDL không (cờ MTM_PHONG_THI_DB ở Vercel): bảng xếp hạng công khai trả enabled.
          bxh=$(curl -sS -m 20 "https://minhthanhmath.vn/api/phong-thi?xep-hang-dot=hsa-thu-2026-11" | jq -r 'if type=="object" and has("enabled") then (.enabled|tostring) else "khong-ro" end' 2>/dev/null || echo khong-ro)
          echo "Phòng thi ghi CSDL (bảng xếp hạng enabled): $bxh"
          mkdir -p ra; jq -c --arg b "$bxh" '.[0].so + {phongThiGhiCsdl:$b}' /tmp/ket-qua.json > /tmp/so.json
          [ "$(jq -r 'type' /tmp/so.json)" = object ] || { echo "Kết quả không đúng dạng"; exit 1; }
          openssl rand -hex 32 > /tmp/k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/so.json -out ra/so.json.enc -pass file:/tmp/k.txt
          openssl pkeyutl -encrypt -pubin -inkey .github/so-pheu/khoa-cong-khai.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /tmp/k.txt -out ra/k.enc
          echo "$tu $den" > ra/khoang.txt
          shred -u /tmp/so.json /tmp/k.txt /tmp/ket-qua.json
          echo "ĐẠT  số phễu $tu → $den (đã mã hóa)"
      - name: Ghi bản mã hóa vào issue so-pheu
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create so-pheu --color 0e8a16 --description "Số phễu marketing (đã mã hóa)" 2>/dev/null || true
          { echo "Số phễu đã mã hóa, chỉ mở được bằng khóa riêng nội bộ. Khoảng: $(cat ra/khoang.txt). Cập nhật: $(TZ=Asia/Ho_Chi_Minh date '+%F %H:%M')"
            echo; echo '---k'; base64 -w0 ra/k.enc; echo; echo '---so'; base64 -w0 ra/so.json.enc; echo; echo '---het'; } > /tmp/than.md
          so=$(gh issue list --label so-pheu --state open --json number --jq '.[0].number // empty')
          if [ -z "$so" ]; then gh issue create --title "Số phễu hằng ngày (mã hóa)" --label so-pheu --body-file /tmp/than.md >/dev/null
          else gh issue edit "$so" --body-file /tmp/than.md >/dev/null; fi
          echo "ĐẠT  đã ghi issue so-pheu"
      - uses: actions/upload-artifact@v4
        with:
          name: so-pheu
          path: ra/
          retention-days: 30
