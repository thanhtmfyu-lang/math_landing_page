name: chan-doan-btvn
on:
  push:
    branches: [chan-doan-btvn]
jobs:
  do:
    runs-on: ubuntu-latest
    steps:
      - name: Do API BTVN co Origin
        run: |
          set +e
          B=https://www.minhthanhmath.vn
          for i in 1 2 3; do for a in state classes; do
            echo "== $i action $a"
            curl -sS -m 90 -w "\nHTTP %{http_code} %{time_total}s\n" -X POST -H "Origin: $B" -H 'Content-Type: application/json' -d "{\"action\":\"$a\"}" $B/api/btvn | cut -c1-300
          done; done
          echo "== login sai"
          curl -sS -m 90 -w "\nHTTP %{http_code} %{time_total}s\n" -X POST -H "Origin: $B" -H 'Content-Type: application/json' -d '{"action":"login","gate":{"fullName":"Thu Nghiem","phone":"0900000000","className":"2K10 Lớp 9+","pin":"123456"}}' $B/api/btvn | cut -c1-300
