# Canh web: fallback 10 phút; lịch thật ổn định thì chờ, không tắt đồng hồ.
# Bốn lượt schedule thành công liên tiếp trong 20-45 phút, cách nhau <=15 phút.
# >30 phút không có schedule: tự gọi Canh web lại. Kiểm sau deploy độc lập <=50 phút.
# Chạy 5h45 rồi nối lượt mới, kể cả đang chờ. Không đổi quyền/secret/giao diện.
name: Đồng hồ thay lịch

on:
  workflow_dispatch:
    inputs:
      carry_intents:
        description: 'Nội bộ: giữ thời điểm các chu kỳ đã gọi để tránh lặp khi nối lượt'
        type: string
        required: false
        default: ''

permissions:
  actions: write
  contents: read

concurrency:
  group: dong-ho
  cancel-in-progress: false

jobs:
  dong-ho:
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_REF: ${{ github.event.repository.default_branch }}
      GH_RUN_ID: ${{ github.run_id }}
      CARRY_INTENTS: ${{ inputs.carry_intents || '' }}
    steps:
      - name: Gọi các workflow theo giờ và tự phục hồi
        shell: bash
        run: |
          python3 -u - <<'PY'
          import datetime as dt
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          
          WEB = "canh-web.yml"
          CHECK = "kiem-sau-deploy.yml"
          FUNNEL = "so-pheu.yml"
          CLOCK = "dong-ho.yml"
          TARGETS = {WEB, CHECK, FUNNEL}
          BUSY = {"queued", "in_progress", "waiting", "pending", "requested"}
          
          
          def stamp(run):
              raw = run.get("run_started_at") or run.get("created_at")
              return dt.datetime.fromisoformat(raw.replace("Z", "+00:00")).timestamp()
          
          
          def schedule_health(runs, now):
              # Four consecutive successful runs: three intervals, spanning 20-45 minutes.
              ordered = sorted(runs, key=lambda r: r["created_at"], reverse=True)[:4]
              age = now - stamp(ordered[0]) if ordered else float("inf")
              if len(ordered) < 4 or not 0 <= age <= 900:
                  return False, age
              if any(r.get("status") != "completed" or r.get("conclusion") != "success"
                     for r in ordered):
                  return False, age
              times = [stamp(r) for r in ordered]
              gaps = [times[i] - times[i + 1] for i in range(3)]
              return (all(0 < gap <= 900 for gap in gaps)
                      and 1200 <= times[0] - times[-1] <= 2700), age
          
          
          def due(runs, now, interval):
              if any(r.get("status") in BUSY for r in runs):
                  return False
              return not runs or now - max(stamp(r) for r in runs) >= interval
          
          
          def request_once(api, state, target, now):
              # Reserve before POST. An ambiguous response must not cause a second POST.
              state["intent"][target] = now
              try:
                  api.dispatch(target)
                  print(f"{dt.datetime.fromtimestamp(now, dt.timezone.utc).isoformat()} dispatch {target}", flush=True)
                  return True
              except urllib.error.HTTPError as exc:
                  label = "REJECTED" if 400 <= exc.code < 500 and exc.code != 408 else "UNCONFIRMED"
                  print(f"Dispatch {target}: {label} HTTP {exc.code}; no retry of this slot", flush=True)
                  return False
              except Exception as exc:
                  print(f"Dispatch {target}: UNCONFIRMED ({type(exc).__name__}); no retry of this slot", flush=True)
                  return False
          
          
          def check_target(api, state, target, now, interval):
              if now - state["intent"].get(target, float("-inf")) < interval:
                  return
              try:
                  runs = api.runs(target)
                  if due(runs, now, interval):
                      request_once(api, state, target, now)
              except Exception as exc:
                  print(f"Read {target}: {type(exc).__name__}; wait for next observation", flush=True)
          
          
          def tick(api, state, now):
              try:
                  stable, age = schedule_health(api.runs(WEB, event="schedule", limit=4), now)
                  if stable and not state["standby"]:
                      state["standby"] = True
                      print("Schedule stable: standby; clock remains alive", flush=True)
                  elif state["standby"] and not stable:
                      state["standby"] = False
                      print("Schedule no longer stable: resume fallback (always before >30 min stale)", flush=True)
                  if not state["standby"]:
                      check_target(api, state, WEB, now, 600)
              except Exception as exc:
                  print(f"Schedule read: {type(exc).__name__}; health unknown", flush=True)
                  # An independent history read can still establish whether dispatch is due.
                  state["standby"] = False
                  check_target(api, state, WEB, now, 600)
              # Independent of WEB's health: leave 10 minutes of margin before 1 hour.
              check_target(api, state, CHECK, now, 3000)
              # Preserve the existing 21:00 Vietnam funnel call; no new destination.
              vn = dt.datetime.fromtimestamp(now, dt.timezone(dt.timedelta(hours=7)))
              day = vn.date().isoformat()
              if vn.hour == 21 and state["funnel_day"] != day:
                  start = vn.replace(hour=21, minute=0, second=0, microsecond=0).timestamp()
                  try:
                      rows = api.runs(FUNNEL)
                      already = any(dt.datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")).timestamp() >= start for r in rows)
                      # Read native history and carried intent across the clock boundary.
                      state["funnel_day"] = day
                      if not already and state["intent"].get(FUNNEL, 0) < start:
                          request_once(api, state, FUNNEL, now)
                  except Exception as exc:
                      print(f"Read {FUNNEL}: {type(exc).__name__}; no dispatch without history", flush=True)
          
          
          class GitHub:
              def __init__(self):
                  self.base = "https://api.github.com/repos/" + os.environ["GH_REPO"]
                  self.branch = os.environ["GH_REF"]
                  self.headers = {
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "MTM-dong-ho",
                  }
          
              def runs(self, workflow, event=None, limit=20):
                  params = {"branch": self.branch, "per_page": limit}
                  if event:
                      params["event"] = event
                  url = self.base + "/actions/workflows/" + workflow + "/runs?" + urllib.parse.urlencode(params)
                  with urllib.request.urlopen(urllib.request.Request(url, headers=self.headers), timeout=20) as response:
                      return json.load(response)["workflow_runs"]
          
              def dispatch(self, workflow, inputs=None):
                  payload = {"ref": self.branch}
                  if inputs:
                      payload["inputs"] = inputs
                  req = urllib.request.Request(
                      self.base + "/actions/workflows/" + workflow + "/dispatches",
                      data=json.dumps(payload).encode(), headers={**self.headers, "Content-Type": "application/json"}, method="POST")
                  with urllib.request.urlopen(req, timeout=20) as response:
                      if not 200 <= response.status < 300:
                          raise RuntimeError("Dispatch response not confirmed")
          
          
          def main():
              api = GitHub()
              intents = json.loads(os.environ.get("CARRY_INTENTS", "") or "{}")
              if not isinstance(intents, dict) or not set(intents) <= TARGETS:
                  raise ValueError("Invalid carried intent targets")
              if any(type(t) not in (int, float) or not 0 <= t <= time.time() + 60 for t in intents.values()):
                  raise ValueError("Invalid carried intent timestamps")
              state = {"standby": False, "intent": intents, "funnel_day": None}
              start = time.monotonic()
              end = start + 20700  # 5h45; leave room before the 358-minute job limit.
              chain_at = None
              chain_seen = False
              while time.monotonic() < end:
                  tick(api, state, time.time())
                  if chain_at is None and time.monotonic() - start >= 19800:
                      # Fifteen minutes to reconcile the single POST with native history.
                      chain_at = time.time()
                      try:
                          api.dispatch(CLOCK, {"carry_intents": json.dumps(state["intent"])})
                      except Exception as exc:
                          print(f"Clock dispatch: {type(exc).__name__}; reconcile, do not replay", flush=True)
                  if chain_at is not None and not chain_seen:
                      try:
                          chain_seen = any(
                              dt.datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")).timestamp() >= chain_at - 5
                              and str(r.get("id")) != os.environ.get("GH_RUN_ID", "")
                              and r.get("event") == "workflow_dispatch"
                              and r.get("conclusion") not in {"cancelled", "failure", "timed_out"}
                              for r in api.runs(CLOCK))
                      except Exception as exc:
                          print(f"Read next clock: {type(exc).__name__}; receipt pending", flush=True)
                  time.sleep(min(60, max(0, end - time.monotonic())))
              if not chain_seen:
                  raise RuntimeError("Next clock UNCONFIRMED; no repeated POST, owner must reconcile")
              print("Next clock exists in native history; this clock yields its concurrency slot", flush=True)
          
          
          if __name__ == "__main__":
              main()
          PY
