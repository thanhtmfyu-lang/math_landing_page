name: chan-doan-btvn-2
on:
  push:
    branches: [chan-doan-btvn-2]
jobs:
  do:
    runs-on: ubuntu-latest
    steps:
      - name: Chup dau trang web that
        run: |
          mkdir -p shots && cd shots && npm init -y >/dev/null && npm i -s playwright@1.56.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cat > s.mjs <<'JS'
          import {chromium} from 'playwright';
          const b=await chromium.launch();
          for(const [w,h,t] of [[1366,800,'may-tinh'],[390,844,'dien-thoai']]){
            const p=await b.newPage({viewport:{width:w,height:h},deviceScaleFactor:w<500?2:1});
            for(const [path,n] of [['/','trang-chu'],['/khoa-hoc','khoa-hoc']]){
              await p.goto('https://www.minhthanhmath.vn'+path+'?nguon=kiem-dau-trang',{waitUntil:'networkidle'});await p.waitForTimeout(1500);
              const d=p.getByRole('button',{name:'Đã xem, vào trang chủ'});if(await d.count())await d.click();await p.waitForTimeout(500);
              const n6=await p.locator('.mtm-quick-row a').count(),more=await p.locator('.mtm-quick-more a').count(),map=await p.locator('.mtm-footer-map').count();
              console.log(t,path,'nut-lon',n6,'nut-nhom',more,'khoi-3-cot-chan-trang',map);
              await p.screenshot({path:`${t}-${n}.png`});
            }
            await p.evaluate(()=>scrollTo(0,document.body.scrollHeight));await p.waitForTimeout(800);await p.screenshot({path:`${t}-chan-trang.png`});
          }
          await b.close();
          JS
          node s.mjs
      - uses: actions/upload-artifact@v4
        with: {name: anh-dau-trang, path: shots/*.png}
