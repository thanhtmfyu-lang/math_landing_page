# Kiểm tra mỗi PR và mỗi lần đẩy lên main: build phải xanh mới được merge.
# Bộ test chạy đầy đủ với PDF fixture và lịch sử nguồn cần đối chiếu.
name: Kiểm tra PR

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: kiem-tra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Kho có ~3 GB đề PDF và ảnh trong public/: không cần để build mã.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/**/*.pdf
            !/build/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npx vite build --outDir "$RUNNER_TEMP/build"
      - name: Quét bản build (W05 không lộ học phí, không lộ khóa)
        run: node scripts/quet-cong-khai.mjs --build "$RUNNER_TEMP/build"
      - name: Sitemap có trang chính
        run: |
          for p in /kiem-tra-dau-vao /phong-thi-thu /ky-khao-sat /de-giua-ky-1; do
            grep -q "minhthanhmath.vn$p</loc>" "$RUNNER_TEMP/build/sitemap.xml" || { echo "Thiếu $p trong sitemap"; exit 1; }
          done

  # D05: kho công khai, mỗi PR quét dòng mới thêm: SĐT thật, khóa bí mật, đáp án, tệp dữ liệu học sinh.
  quet-lo:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts
      - name: Quét dòng mới trong PR
        run: node scripts/quet-cong-khai.mjs --diff "origin/${{ github.base_ref }}"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Asset tests kiểm SHA của PDF; KT06/V77 cần git show bản lịch sử.
          # Lấy đủ cây hiện tại, lazy-fetch blob cũ khi test thật sự cần.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
