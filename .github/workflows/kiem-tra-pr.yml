# Kiểm tra mỗi PR và mỗi lần đẩy lên main: build phải xanh mới được merge.
# Bộ test chạy đầy đủ và báo số file lỗi thành cảnh báo; khi main hết test
# lỗi sẵn thì để test cũng chặn merge (xem bước "Chạy test").
name: Kiểm tra PR

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: kiem-tra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Kho có ~3 GB đề PDF và ảnh trong public/: không cần để build mã.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/**/*.pdf
            !/build/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build
        run: npx vite build --outDir "$RUNNER_TEMP/build"
      - name: Sitemap có trang chính
        run: |
          for p in /kiem-tra-dau-vao /phong-thi-thu /ky-khao-sat /de-giua-ky-1; do
            grep -q "minhthanhmath.vn$p</loc>" "$RUNNER_TEMP/build/sitemap.xml" || { echo "Thiếu $p trong sitemap"; exit 1; }
          done

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/public/**/*.pdf
            !/build/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Chưa chặn merge: main còn test lỗi sẵn. Số file lỗi hiện thành cảnh báo
      # và ghi vào tóm tắt job. Main xanh thì bỏ "|| ..." để test chặn merge.
      - name: Chạy test
        run: |
          npm test 2>&1 | tee test.log || true
          dong=$(grep -E "file test (lỗi|đạt)" test.log | tail -1)
          echo "Kết quả test: ${dong:-không đọc được}" >> "$GITHUB_STEP_SUMMARY"
          grep -E "^LỖI " test.log >> "$GITHUB_STEP_SUMMARY" || true
          case "$dong" in *lỗi*) echo "::warning::$dong (lỗi sẵn trên main, chưa chặn merge)";; esac
